AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless To-Do API - CloudFront, WAF, API Gateway, Cognito, Lambda, DynamoDB, X-Ray

Parameters:
  EnableApiCache:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: API Gateway cache cluster (0.5 GB) is billed hourly. Turn on for the caching demo, off afterwards.
  RateLimit:
    Type: Number
    Default: 500
    Description: Max requests per 5 minutes per client IP (WAF rate-based rule)

Conditions:
  CacheOn: !Equals [!Ref EnableApiCache, 'true']

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Tracing: Active

Resources:
  # ---------- Authentication ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub ${AWS::StackName}-${AWS::AccountId}

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub 'https://${Distribution.DomainName}/']
      LogoutURLs: [!Sub 'https://${Distribution.DomainName}/']
      # USER_PASSWORD_AUTH is only here so you can get a token from the CLI for testing
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  # ---------- Data ----------
  TodoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        - {AttributeName: todoId, AttributeType: S}
        - {AttributeName: status, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: todoId, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - {AttributeName: userId, KeyType: HASH}
            - {AttributeName: status, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      StreamSpecification: {StreamViewType: NEW_AND_OLD_IMAGES}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  # ---------- API ----------
  TodoApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      TracingEnabled: true
      CacheClusterEnabled: !If [CacheOn, true, false]
      CacheClusterSize: '0.5'
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 25
          CachingEnabled: false
        - ResourcePath: /api/todos
          HttpMethod: GET
          CachingEnabled: !If [CacheOn, true, false]
          CacheTtlInSeconds: 30
      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
            Identity:
              Header: Authorization

  TodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TodoTable
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref TodoTable}
      Events:
        # Authorization header is part of the cache key so users never see each other's cached data
        List:   {Type: Api, Properties: {RestApiId: !Ref TodoApi, Path: /api/todos, Method: get, RequestParameters: [{method.request.header.Authorization: {Caching: true}}]}}
        Create: {Type: Api, Properties: {RestApiId: !Ref TodoApi, Path: /api/todos, Method: post}}
        Read:   {Type: Api, Properties: {RestApiId: !Ref TodoApi, Path: '/api/todos/{id}', Method: get}}
        Update: {Type: Api, Properties: {RestApiId: !Ref TodoApi, Path: '/api/todos/{id}', Method: put}}
        Delete: {Type: Api, Properties: {RestApiId: !Ref TodoApi, Path: '/api/todos/{id}', Method: delete}}

  # DynamoDB Streams consumer: demonstrates change-data-capture; extend it to send emails, audit, etc.
  StreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      InlineCode: |
        def handler(event, context):
            for r in event["Records"]:
                print(r["eventName"], r["dynamodb"]["Keys"])
      Events:
        Stream:
          Type: DynamoDB
          Properties: {Stream: !GetAtt TodoTable.StreamArn, StartingPosition: LATEST, BatchSize: 10}

  # ---------- WAF (regional, attached to the API stage) ----------
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: todo-waf}
      Rules:
        - Name: RateLimitPerIP
          Priority: 0
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimit
              AggregateKeyType: FORWARDED_IP   # API GW sits behind CloudFront, so use the real client IP
              ForwardedIPConfig: {HeaderName: X-Forwarded-For, FallbackBehavior: MATCH}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate-limit}
        - Name: CommonRuleSet   # OWASP-style protections (SQLi, XSS, bad bots, size limits)
          Priority: 1
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common-rules}
        - Name: KnownBadInputs
          Priority: 2
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: bad-inputs}
        - Name: IpReputation
          Priority: 3
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ip-reputation}

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: TodoApiProdStage
    Properties:
      ResourceArn: !Sub arn:aws:apigateway:${AWS::Region}::/restapis/${TodoApi}/stages/Prod
      WebACLArn: !GetAtt WebAcl.Arn

  # ---------- Frontend hosting: private S3 + CloudFront (one domain for site and /api) ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: api
            DomainName: !Sub ${TodoApi}.execute-api.${AWS::Region}.amazonaws.com
            OriginPath: /Prod
            CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2]}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-42e2-a2ce-d3ee6c7fee14 # Managed-AllViewerExceptHostHeader

Outputs:
  SiteUrl: {Value: !Sub 'https://${Distribution.DomainName}'}
  ApiUrl: {Value: !Sub 'https://${Distribution.DomainName}/api/todos'}
  CognitoDomain: {Value: !Sub '${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'}
  UserPoolId: {Value: !Ref UserPool}
  UserPoolClientId: {Value: !Ref UserPoolClient}
  SiteBucket: {Value: !Ref SiteBucket}
  DistributionId: {Value: !Ref Distribution}
