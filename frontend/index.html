<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<style>
  :root { --ink:#1b2a41; --paper:#f3f6f9; --card:#fff; --accent:#0f766e; --muted:#667489; --line:#d5dde6; --danger:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:2.4rem; letter-spacing:-.02em; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:10px 16px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  header button { padding:6px 12px; font-size:.9rem; }
  form { display:flex; gap:8px; margin-bottom:20px; }
  input[type=text] { flex:1; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; }
  ul { list-style:none; padding:0; margin:0; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  li { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li input { width:20px; height:20px; accent-color:var(--accent); }
  li span { flex:1; overflow-wrap:anywhere; }
  li.done span { color:var(--muted); text-decoration:line-through; }
  li button { border:0; background:none; color:var(--danger); padding:4px 8px; }
  .empty, #msg { color:var(--muted); padding:16px 14px; }
  #msg.err { color:var(--danger); padding:0 0 12px; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <section id="signedOut" hidden>
    <h1>Tasks</h1>
    <p class="sub">A to-do list that only you can see.</p>
    <button class="primary" id="signIn">Sign in or create account</button>
  </section>

  <section id="app" hidden>
    <header><h1>Tasks</h1><button id="signOut">Sign out</button></header>
    <p class="sub" id="who"></p>
    <p id="msg" class="err" hidden></p>
    <form id="form">
      <input type="text" id="title" placeholder="What needs doing?" maxlength="200" required aria-label="New task">
      <button class="primary">Add task</button>
    </form>
    <ul id="list"></ul>
  </section>
</main>
<script src="config.js"></script>
<script>
const { domain, clientId } = window.CONFIG;
const redirectUri = location.origin + "/";
const $ = id => document.getElementById(id);
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

async function signIn() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  sessionStorage.setItem("verifier", verifier);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  location.href = `https://${domain}/oauth2/authorize?` + new URLSearchParams({
    response_type:"code", client_id:clientId, redirect_uri:redirectUri, scope:"openid email",
    code_challenge_method:"S256", code_challenge:challenge });
}
function signOut() {
  sessionStorage.clear();
  location.href = `https://${domain}/logout?` + new URLSearchParams({ client_id:clientId, logout_uri:redirectUri });
}
async function exchangeCode(code) {
  const r = await fetch(`https://${domain}/oauth2/token`, { method:"POST",
    headers:{ "Content-Type":"application/x-www-form-urlencoded" },
    body:new URLSearchParams({ grant_type:"authorization_code", client_id:clientId, code,
      redirect_uri:redirectUri, code_verifier:sessionStorage.getItem("verifier") }) });
  if (!r.ok) throw new Error("Sign-in failed");
  sessionStorage.setItem("idToken", (await r.json()).id_token);
}

async function api(path = "", opts = {}) {
  const r = await fetch("/api/todos" + path, { ...opts, headers:{ "Content-Type":"application/json",
    Authorization: sessionStorage.getItem("idToken") } });
  if (r.status === 401) { signOut(); throw new Error("Session expired"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Request failed");
  return r.status === 204 ? null : r.json();
}
function showError(e) { const m = $("msg"); m.textContent = e.message; m.hidden = !e.message; }

async function render() {
  try {
    const todos = await api(); showError({ message:"" });
    const ul = $("list"); ul.replaceChildren();
    if (!todos.length) { ul.innerHTML = '<li class="empty">No tasks yet. Add your first one above.</li>'; return; }
    for (const t of todos) {
      const li = document.createElement("li"); li.className = t.status;
      const cb = Object.assign(document.createElement("input"), { type:"checkbox", checked:t.status === "done" });
      cb.setAttribute("aria-label", "Mark done");
      cb.onchange = () => api("/" + t.todoId, { method:"PUT", body:JSON.stringify({ status: cb.checked ? "done" : "open" }) }).then(render).catch(showError);
      const span = Object.assign(document.createElement("span"), { textContent:t.title });
      const del = Object.assign(document.createElement("button"), { textContent:"Delete" });
      del.onclick = () => api("/" + t.todoId, { method:"DELETE" }).then(render).catch(showError);
      li.append(cb, span, del); ul.append(li);
    }
  } catch (e) { showError(e); }
}

(async () => {
  const code = new URLSearchParams(location.search).get("code");
  if (code) { try { await exchangeCode(code); } catch (e) { alert(e.message); } history.replaceState({}, "", "/"); }
  const token = sessionStorage.getItem("idToken");
  $("signIn").onclick = signIn;
  if (!token) { $("signedOut").hidden = false; return; }
  $("app").hidden = false;
  $("who").textContent = JSON.parse(atob(token.split(".")[1])).email;
  $("signOut").onclick = signOut;
  $("form").onsubmit = async e => {
    e.preventDefault();
    try { await api("", { method:"POST", body:JSON.stringify({ title:$("title").value }) }); $("title").value = ""; render(); }
    catch (err) { showError(err); }
  };
  render();
})();
</script>
</body>
</html>
